<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Escuela Candelaria Pérez | v9.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
    <div class="bg-gradient-to-r from-blue-700 via-indigo-700 to-slate-800 p-6 text-center">
      <span class="inline-block px-2.5 py-0.5 text-[11px] font-bold uppercase tracking-widest bg-white/15 text-blue-100 rounded-full mb-2">
        Decreto 67 & Convivencia Escolar
      </span>
      <h1 class="text-2xl font-bold tracking-tight text-white">Escuela Candelaria Pérez</h1>
      <p class="text-blue-200 text-sm mt-1">Plataforma Integral de Gestión v9.0</p>
    </div>

    <div class="grid grid-cols-2 border-b border-slate-800 bg-slate-900">
      <button id="tab-estudiante" onclick="cambiarTab('estudiante')"
        class="py-3 text-sm font-semibold border-b-2 border-blue-500 text-blue-400 transition">
        Estudiantes / Apoderados
      </button>
      <button id="tab-staff" onclick="cambiarTab('staff')"
        class="py-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition">
        Docentes / Dirección
      </button>
    </div>

    <form id="login-form" class="p-6 space-y-4">
      <div>
        <label id="lbl-identificador" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">
          RUT o Nombre del Estudiante
        </label>
        <input id="identificador" type="text" required placeholder="Ej: 25201656-2"
          class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-blue-500" />
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">
          Contraseña
        </label>
        <input id="password" type="password" required placeholder="••••••••"
          class="w-full px-4 py-2.5 rounded-lg bg-slate-950 border border-slate-800 text-white focus:outline-none focus:border-blue-500" />
      </div>

      <div id="error-box" class="hidden p-3 rounded-lg bg-red-950/80 border border-red-800 text-red-200 text-sm"></div>

      <button type="submit" id="btn-submit"
        class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg shadow-lg transition">
        Ingresar al Portal
      </button>

      <div class="pt-3 border-t border-slate-800 text-xs text-slate-400 space-y-1">
        <p class="font-semibold text-slate-300">Servidor API:</p>
        <input id="api-url" type="text"
          class="w-full px-2.5 py-1.5 rounded bg-slate-950 border border-slate-800 text-slate-400 text-xs"
          value="https://escuelacandelariaperez.onrender.com" />
      </div>
    </form>
  </div>

  <script>
    const SESSION_KEY = "ecp_v9_session";
    let tipoPortal = "estudiante";

    const savedApi = localStorage.getItem("ecp_v9_api");
    if (savedApi) document.getElementById("api-url").value = savedApi;

    function cambiarTab(tipo) {
      tipoPortal = tipo;
      const tabEst = document.getElementById("tab-estudiante");
      const tabStaff = document.getElementById("tab-staff");
      const lbl = document.getElementById("lbl-identificador");
      const inp = document.getElementById("identificador");

      if (tipo === "estudiante") {
        tabEst.className = "py-3 text-sm font-semibold border-b-2 border-blue-500 text-blue-400 transition";
        tabStaff.className = "py-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition";
        lbl.textContent = "RUT o Nombre del Estudiante";
        inp.placeholder = "Ej: 25201656-2";
      } else {
        tabStaff.className = "py-3 text-sm font-semibold border-b-2 border-indigo-500 text-indigo-400 transition";
        tabEst.className = "py-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-slate-200 transition";
        lbl.textContent = "Nombre Completo o Usuario Docente";
        inp.placeholder = "Ej: Paulina Toledo o HÉCTOR GONZÁLEZ GAETE";
      }
      document.getElementById("error-box").classList.add("hidden");
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errBox = document.getElementById("error-box");
      const btn = document.getElementById("btn-submit");
      errBox.classList.add("hidden");

      const apiUrl = document.getElementById("api-url").value.trim().replace(/\/$/, "");
      localStorage.setItem("ecp_v9_api", apiUrl);

      const identificador = document.getElementById("identificador").value.trim();
      const password = document.getElementById("password").value.trim();

      btn.disabled = true;
      btn.textContent = "Conectando...";

      try {
        const res = await fetch(`${apiUrl}/api/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ identificador, password, tipo_portal: tipoPortal })
        });
        const data = await res.json();

        if (!res.ok || !data.ok) {
          throw new Error(data.detail || "Credenciales inválidas.");
        }

        localStorage.removeItem(SESSION_KEY);
        localStorage.setItem(SESSION_KEY, JSON.stringify(data.usuario));

        const rol = (data.usuario.rol || "").toLowerCase().trim();
        if (rol === "maestro") window.location.href = "maestro.html";
        else if (rol === "docente") window.location.href = "docente.html";
        else if (rol === "estudiante") window.location.href = "estudiante.html";
        else throw new Error("Rol no reconocido: " + rol);
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.textContent = "Ingresar al Portal";
      }
    });
  </script>
</body>
</html>
