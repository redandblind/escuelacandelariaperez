<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Estudiante | Escuela Candelaria Pérez</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <script>
    const SESSION_KEY = "ecp_v8_session";
    const API_URL = (localStorage.getItem("ecp_v8_api") || "https://escuelacandelariaperez.onrender.com").replace(/\/$/, "");
    let currentUser = null;
    try {
      currentUser = JSON.parse(localStorage.getItem(SESSION_KEY));
    } catch (e) { currentUser = null; }

    if (!currentUser || (currentUser.rol || "").toLowerCase().trim() !== "estudiante") {
      localStorage.removeItem(SESSION_KEY);
      window.location.replace("index.html");
    }
  </script>

  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
    <div>
      <span class="text-xs font-bold uppercase tracking-wider text-blue-400">Portal del Estudiante v8.0</span>
      <h1 id="est-nombre" class="text-xl font-bold text-white">Estudiante</h1>
      <p id="est-curso" class="text-xs text-slate-400"></p>
    </div>
    <button onclick="cerrarSesion()" class="px-4 py-1.5 bg-red-600 hover:bg-red-500 text-white text-sm font-semibold rounded-lg">
      Cerrar Sesión
    </button>
  </header>

  <main class="max-w-5xl mx-auto p-6 space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl">
        <p class="text-xs text-slate-400 uppercase">Promedio General</p>
        <p id="est-promedio" class="text-3xl font-bold text-emerald-400 mt-1">--</p>
      </div>
      <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl">
        <p class="text-xs text-slate-400 uppercase">Registros de Asistencia</p>
        <p id="est-asistencia-resumen" class="text-lg font-semibold text-blue-300 mt-2">--</p>
      </div>
    </div>

    <!-- Calificaciones -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 overflow-x-auto">
      <h2 class="text-lg font-bold text-white mb-3">Mis Calificaciones</h2>
      <table class="w-full text-left text-sm">
        <thead class="border-b border-slate-700 text-slate-400">
          <tr>
            <th class="py-2">Asignatura</th>
            <th class="py-2">Evaluación</th>
            <th class="py-2">Fecha</th>
            <th class="py-2">Nota</th>
          </tr>
        </thead>
        <tbody id="tabla-mis-notas" class="divide-y divide-slate-700/60"></tbody>
      </table>
    </div>

    <!-- Comunicados -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-5">
      <h2 class="text-lg font-bold text-white mb-3">Comunicados de Dirección</h2>
      <div id="lista-alertas" class="space-y-2 text-sm text-slate-300"></div>
    </div>
  </main>

  <script>
    if (currentUser) {
      document.getElementById("est-nombre").textContent = currentUser.nombre;
      document.getElementById("est-curso").textContent = "Curso: " + (currentUser.curso || "No asignado");
    }

    function cerrarSesion() {
      localStorage.removeItem(SESSION_KEY);
      window.location.replace("index.html");
    }

    async function cargarEstudiante() {
      if (!currentUser) return;
      try {
        const res = await fetch(`${API_URL}/api/estudiante/${currentUser.id}`);
        const data = await res.json();
        const notas = data.notas || [];

        if (notas.length > 0) {
          const suma = notas.reduce((acc, n) => acc + Number(n.nota), 0);
          document.getElementById("est-promedio").textContent = (suma / notas.length).toFixed(1);
        }

        document.getElementById("tabla-mis-notas").innerHTML = notas.length
          ? notas.map(n => `
              <tr>
                <td class="py-2 font-medium">${n.asignatura}</td>
                <td class="py-2">${n.evaluacion}</td>
                <td class="py-2 text-slate-400">${n.fecha}</td>
                <td class="py-2 font-bold ${Number(n.nota) >= 4.0 ? "text-emerald-400" : "text-red-400"}">${Number(n.nota).toFixed(1)}</td>
              </tr>
            `).join("")
          : `<tr><td colspan="4" class="py-3 text-slate-400">Aún no tienes calificaciones registradas.</td></tr>`;

        const asist = data.asistencia || [];
        const presentes = asist.filter(a => a.estado === "Presente").length;
        document.getElementById("est-asistencia-resumen").textContent =
          asist.length ? `${presentes} presentes de ${asist.length} registros` : "Sin registros aún";

        const alertas = data.alertas || [];
        document.getElementById("lista-alertas").innerHTML = alertas.length
          ? alertas.map(a => `
              <div class="p-3 rounded-lg bg-slate-900 border border-slate-700">
                <p class="font-semibold text-blue-300">${a.titulo}</p>
                <p class="text-slate-400 text-xs mt-1">${a.detalle}</p>
              </div>
            `).join("")
          : `<p class="text-slate-400">No hay comunicados nuevos.</p>`;
      } catch (e) {
        console.error("Error cargando datos estudiante:", e);
      }
    }

    cargarEstudiante();
  </script>
</body>
</html>
