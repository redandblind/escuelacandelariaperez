<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Docente | Escuela Candelaria Pérez</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <script>
    const SESSION_KEY = "ecp_v8_session";
    const API_URL = (localStorage.getItem("ecp_v8_api") || "https://escuelacandelariaperez.onrender.com").replace(/\/$/, "");
    let currentUser = null;
    try {
      currentUser = JSON.parse(localStorage.getItem(SESSION_KEY));
    } catch (e) { currentUser = null; }

    const rolActual = currentUser && currentUser.rol ? String(currentUser.rol).toLowerCase().trim() : "";
    if (!currentUser || rolActual !== "docente") {
      localStorage.removeItem(SESSION_KEY);
      window.location.replace("index.html");
    }
  </script>

  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
    <div>
      <span class="text-xs font-bold uppercase tracking-wider text-emerald-400">Portal Docente v8.0</span>
      <h1 id="docente-titulo" class="text-xl font-bold text-white">Bienvenido/a</h1>
    </div>
    <button onclick="cerrarSesion()" class="px-4 py-1.5 bg-red-600 hover:bg-red-500 text-white text-sm font-semibold rounded-lg">
      Cerrar Sesión
    </button>
  </header>

  <main class="max-w-6xl mx-auto p-6 space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-4">
        <h2 class="text-lg font-bold text-white">Ingresar Calificación</h2>
        <form id="form-nota" class="space-y-3">
          <select id="n-estudiante" required class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-sm">
            <option value="">Cargando estudiantes...</option>
          </select>
          <input id="n-asignatura" type="text" required placeholder="Asignatura (ej: Matemática)" class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-sm" />
          <input id="n-evaluacion" type="text" required placeholder="Evaluación (ej: Prueba Unidad 1)" class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-sm" />
          <input id="n-nota" type="number" step="0.1" min="1.0" max="7.0" required placeholder="Nota (1.0 a 7.0)" class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-sm" />
          <button type="submit" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-semibold text-sm">
            Registrar Nota
          </button>
        </form>
      </div>

      <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-4">
        <h2 class="text-lg font-bold text-white">Control de Asistencia</h2>
        <form id="form-asistencia" class="space-y-3">
          <select id="as-estudiante" required class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-sm">
            <option value="">Cargando estudiantes...</option>
          </select>
          <select id="as-estado" class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-sm">
            <option value="Presente">Presente</option>
            <option value="Ausente">Ausente</option>
            <option value="Atrasado">Atrasado</option>
          </select>
          <button type="submit" class="w-full py-2 bg-blue-600 hover:bg-blue-500 rounded-lg font-semibold text-sm">
            Guardar Asistencia
          </button>
        </form>
      </div>
    </div>

    <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 overflow-x-auto">
      <h2 class="text-lg font-bold text-white mb-3">Últimas Calificaciones Registradas</h2>
      <table class="w-full text-left text-sm">
        <thead class="border-b border-slate-700 text-slate-400">
          <tr>
            <th class="py-2">Estudiante</th>
            <th class="py-2">Curso</th>
            <th class="py-2">Asignatura</th>
            <th class="py-2">Evaluación</th>
            <th class="py-2">Nota</th>
          </tr>
        </thead>
        <tbody id="tabla-notas" class="divide-y divide-slate-700/60"></tbody>
      </table>
    </div>
  </main>

  <script>
    let listaEstudiantes = [];

    if (currentUser) {
      document.getElementById("docente-titulo").textContent =
        `Docente: ${currentUser.nombre} ${currentUser.curso ? "(" + currentUser.curso + ")" : ""}`;
    }

    function cerrarSesion() {
      localStorage.removeItem(SESSION_KEY);
      window.location.replace("index.html");
    }

    async function cargarDatosDocente() {
      try {
        const res = await fetch(`${API_URL}/api/docente/datos`);
        const data = await res.json();
        listaEstudiantes = data.estudiantes || [];

        const opciones = listaEstudiantes.length
          ? listaEstudiantes.map(e => `<option value="${e.id}">${e.nombre} (${e.curso || "Sin curso"})</option>`).join("")
          : `<option value="">No hay estudiantes registrados</option>`;

        document.getElementById("n-estudiante").innerHTML = opciones;
        document.getElementById("as-estudiante").innerHTML = opciones;

        const notas = data.notas || [];
        document.getElementById("tabla-notas").innerHTML = notas.map(n => `
          <tr>
            <td class="py-2 font-medium">${n.estudiante}</td>
            <td class="py-2 text-slate-300">${n.curso || "-"}</td>
            <td class="py-2">${n.asignatura}</td>
            <td class="py-2">${n.evaluacion}</td>
            <td class="py-2 font-bold ${Number(n.nota) >= 4.0 ? "text-emerald-400" : "text-red-400"}">${Number(n.nota).toFixed(1)}</td>
          </tr>
        `).join("");
      } catch (e) {
        console.error("Error cargando datos docente:", e);
      }
    }

    document.getElementById("form-nota").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        estudiante_id: Number(document.getElementById("n-estudiante").value),
        asignatura: document.getElementById("n-asignatura").value,
        evaluacion: document.getElementById("n-evaluacion").value,
        nota: parseFloat(document.getElementById("n-nota").value)
      };
      const res = await fetch(`${API_URL}/api/docente/notas`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        document.getElementById("n-evaluacion").value = "";
        document.getElementById("n-nota").value = "";
        cargarDatosDocente();
      } else {
        alert("Error al registrar la nota.");
      }
    });

    document.getElementById("form-asistencia").addEventListener("submit", async (e) => {
      e.preventDefault();
      const estId = Number(document.getElementById("as-estudiante").value);
      const estObj = listaEstudiantes.find(x => x.id === estId);
      const payload = {
        estudiante_id: estId,
        curso: estObj ? estObj.curso : "",
        estado: document.getElementById("as-estado").value
      };
      const res = await fetch(`${API_URL}/api/docente/asistencia`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        alert("Asistencia registrada correctamente.");
      }
    });

    cargarDatosDocente();
  </script>
</body>
</html>
