<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Centro de Mando Directivo | Escuela Candelaria Pérez</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <script>
    const SESSION_KEY = "ecp_v8_session";
    const API_URL = (localStorage.getItem("ecp_v8_api") || "https://escuelacandelariaperez.onrender.com").replace(/\/$/, "");
    let currentUser = null;
    try {
      currentUser = JSON.parse(localStorage.getItem(SESSION_KEY));
    } catch (e) { currentUser = null; }

    if (!currentUser || (currentUser.rol || "").toLowerCase().trim() !== "maestro") {
      localStorage.removeItem(SESSION_KEY);
      window.location.replace("index.html");
    }
  </script>

  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex flex-wrap justify-between items-center gap-4">
    <div>
      <span class="text-xs font-bold uppercase tracking-wider text-indigo-400">Centro de Mando Directivo v8.0</span>
      <h1 id="directora-nombre" class="text-xl font-bold text-white">Directora: Paulina Toledo</h1>
    </div>
    <div class="flex gap-3">
      <button onclick="ejecutarPromocion()" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white text-sm font-semibold rounded-lg">
        Promoción Anual
      </button>
      <button onclick="cerrarSesion()" class="px-4 py-1.5 bg-red-600 hover:bg-red-500 text-white text-sm font-semibold rounded-lg">
        Cerrar Sesión
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-6 space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl">
        <p class="text-xs text-slate-400 uppercase">Total Estudiantes</p>
        <p id="kpi-estudiantes" class="text-2xl font-bold text-blue-400 mt-1">0</p>
      </div>
      <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl">
        <p class="text-xs text-slate-400 uppercase">Total Docentes</p>
        <p id="kpi-docentes" class="text-2xl font-bold text-emerald-400 mt-1">0</p>
      </div>
      <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl">
        <p class="text-xs text-slate-400 uppercase">Cursos Activos</p>
        <p id="kpi-cursos" class="text-2xl font-bold text-indigo-400 mt-1">0</p>
      </div>
      <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl">
        <p class="text-xs text-slate-400 uppercase">Promedio General Escuela</p>
        <p id="kpi-promedio" class="text-2xl font-bold text-amber-400 mt-1">0.0</p>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-4">
        <h2 class="text-lg font-bold text-white">Registrar Docente o Estudiante</h2>
        <form id="form-usuario" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <input id="u-nombre" type="text" required placeholder="Nombre completo" class="px-3 py-2 rounded bg-slate-900 border border-slate-700 text-sm" />
          <input id="u-rut" type="text" required placeholder="RUT (ej: 12345678-9)" class="px-3 py-2 rounded bg-slate-900 border border-slate-700 text-sm" />
          <select id="u-rol" class="px-3 py-2 rounded bg-slate-900 border border-slate-700 text-sm">
            <option value="docente">Docente</option>
            <option value="estudiante">Estudiante</option>
            <option value="maestro">Dirección (Maestro)</option>
          </select>
          <input id="u-curso" type="text" placeholder="Curso (ej: 8° Básico)" class="px-3 py-2 rounded bg-slate-900 border border-slate-700 text-sm" />
          <input id="u-asignatura" type="text" placeholder="Asignatura (solo docentes)" class="px-3 py-2 rounded bg-slate-900 border border-slate-700 text-sm" />
          <input id="u-password" type="text" required placeholder="Contraseña inicial" class="px-3 py-2 rounded bg-slate-900 border border-slate-700 text-sm" />
          <button type="submit" class="sm:col-span-2 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-semibold text-sm">
            Guardar Usuario
          </button>
        </form>
      </div>

      <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 space-y-4">
        <h2 class="text-lg font-bold text-white">Publicar Alerta o Comunicado Institucional</h2>
        <form id="form-alerta" class="space-y-3">
          <input id="a-titulo" type="text" required placeholder="Título del comunicado" class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-sm" />
          <textarea id="a-detalle" rows="2" required placeholder="Detalle del mensaje para la comunidad escolar..." class="w-full px-3 py-2 rounded bg-slate-900 border border-slate-700 text-sm"></textarea>
          <button type="submit" class="w-full py-2 bg-blue-600 hover:bg-blue-500 rounded-lg font-semibold text-sm">
            Publicar Alerta
          </button>
        </form>
      </div>
    </div>

    <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 overflow-x-auto">
      <h2 class="text-lg font-bold text-white mb-3">Nómina de Usuarios Registrados</h2>
      <table class="w-full text-left text-sm">
        <thead class="border-b border-slate-700 text-slate-400">
          <tr>
            <th class="py-2">Nombre</th>
            <th class="py-2">RUT</th>
            <th class="py-2">Rol</th>
            <th class="py-2">Curso</th>
            <th class="py-2">Asignatura</th>
            <th class="py-2 text-right">Acción</th>
          </tr>
        </thead>
        <tbody id="tabla-usuarios" class="divide-y divide-slate-700/60"></tbody>
      </table>
    </div>
  </main>

  <script>
    if (currentUser) {
      document.getElementById("directora-nombre").textContent = "Directora: " + currentUser.nombre;
    }

    function cerrarSesion() {
      localStorage.removeItem(SESSION_KEY);
      window.location.replace("index.html");
    }

    async function cargarDashboard() {
      try {
        const res = await fetch(`${API_URL}/api/dashboard/maestro`);
        const data = await res.json();
        const usuarios = data.usuarios || [];
        document.getElementById("kpi-estudiantes").textContent = usuarios.filter(u => u.rol === "estudiante").length;
        document.getElementById("kpi-docentes").textContent = usuarios.filter(u => u.rol === "docente").length;
        document.getElementById("kpi-cursos").textContent = (data.cursos || []).length;
        document.getElementById("kpi-promedio").textContent = (data.promedio_general || 0).toFixed(1);

        const tbody = document.getElementById("tabla-usuarios");
        tbody.innerHTML = usuarios.map(u => `
          <tr>
            <td class="py-2 font-medium">${u.nombre}</td>
            <td class="py-2 text-slate-300">${u.rut || "-"}</td>
            <td class="py-2 uppercase text-xs font-bold text-indigo-400">${u.rol}</td>
            <td class="py-2">${u.curso || "-"}</td>
            <td class="py-2">${u.asignatura || "-"}</td>
            <td class="py-2 text-right">
              ${u.rol !== "maestro"
                ? `<button onclick="eliminarUsuario(${u.id})" class="text-red-400 hover:text-red-300 text-xs font-semibold">Eliminar</button>`
                : `<span class="text-xs text-slate-500">Protegido</span>`}
            </td>
          </tr>
        `).join("");
      } catch (e) {
        console.error("Error cargando dashboard:", e);
      }
    }

    document.getElementById("form-usuario").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        nombre: document.getElementById("u-nombre").value,
        rut: document.getElementById("u-rut").value,
        rol: document.getElementById("u-rol").value,
        curso: document.getElementById("u-curso").value,
        asignatura: document.getElementById("u-asignatura").value,
        password: document.getElementById("u-password").value
      };
      const res = await fetch(`${API_URL}/api/usuarios`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        e.target.reset();
        cargarDashboard();
      } else {
        const err = await res.json();
        alert(err.detail || "Error al guardar usuario");
      }
    });

    document.getElementById("form-alerta").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        titulo: document.getElementById("a-titulo").value,
        detalle: document.getElementById("a-detalle").value,
        nivel: "info"
      };
      const res = await fetch(`${API_URL}/api/alertas`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (res.ok) {
        e.target.reset();
        alert("Alerta publicada correctamente.");
      }
    });

    async function eliminarUsuario(id) {
      if (!confirm("¿Eliminar este usuario?")) return;
      await fetch(`${API_URL}/api/usuarios/${id}`, { method: "DELETE" });
      cargarDashboard();
    }

    async function ejecutarPromocion() {
      if (!confirm("¿Ejecutar promoción anual de cursos y reinicio de notas?")) return;
      const res = await fetch(`${API_URL}/api/admin/promocion-anual`, { method: "POST" });
      if (res.ok) {
        alert("Promoción anual completada.");
        cargarDashboard();
      }
    }

    cargarDashboard();
  </script>
</body>
</html>
